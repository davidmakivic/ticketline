<h2>{{ item.name }}</h2>
<p>{{ item.description }}</p>

<div class="quantity">
  <button (click)="decrease()">−</button>
  <input
    type="number"
    [(ngModel)]="quantity"
    min="1"
    [max]="item.quantity"
    (ngModelChange)="onQuantityChange()"
    (blur)="onQuantityBlur()"
    placeholder="0"
  />
  <button (click)="increase()">+</button>
</div>

<!-- Fehlermeldung -->
<div *ngIf="errorMessage" style="color: #ff6b6b; margin-top: 4px; text-align: center;">
  {{ errorMessage }}
</div>

<div *ngIf="item.availableSizes?.length">
  <select [(ngModel)]="selectedSize">
    <option *ngFor="let s of item.availableSizes" [value]="s.size" [disabled]="s.quantity === 0">
      {{ s.size }}
    </option>
  </select>
</div>

<button class="add" (click)="addToCart()">
  In den Warenkorb
</button>
