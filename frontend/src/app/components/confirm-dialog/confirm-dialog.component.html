<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close(false)">
    {{ data.cancelText ?? 'Abbrechen' }}
  </button>

  <button
    mat-flat-button
    [color]="data.danger ? 'warn' : 'primary'"
    (click)="close(true)"
  >
    {{ data.confirmText ?? 'Bestätigen' }}
  </button>
</mat-dialog-actions>
