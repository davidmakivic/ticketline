<div class="forgot-password-container mt-5">
  <div class="d-flex justify-content-between">
    <h1 class="title">Passwort zurücksetzen</h1>
  </div>

  @if (true) {
    <div class="d-flex justify-content-center align-items-center mt-5">
      <mat-spinner></mat-spinner>
    </div>
  } @else {
    <form (ngSubmit)="resetPassword()" class="mt-4">

      <div class="row g-3">

        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" [formControl]="email">

            @if (email.hasError('required')) {
              <mat-error>Email ist erforderlich</mat-error>
            }
            @if (email.hasError('email')) {
              <mat-error>Ungültige Email</mat-error>
            }
          </mat-form-field>
        </div>

        <div class="col-6 d-flex justify-content-start">
          <button mat-stroked-button type="button" routerLink="/login">
            Abbrechen
          </button>
        </div>

        <div class="col-6 d-flex justify-content-end">
          <button mat-flat-button type="submit" [disabled]="email.invalid">
            Passwort zurücksetzen
          </button>
        </div>

      </div>
    </form>
  }

</div>
